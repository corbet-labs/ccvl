name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-clean:
    name: Bootstrap from a minimal archive environment
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Download source without assuming Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Install and verify from an archive-shaped workspace
        run: |
          mkdir -p "$RUNNER_TEMP/ccvl-archive"
          tar --exclude='./.git' -cf - . | tar -xf - -C "$RUNNER_TEMP/ccvl-archive"
          cd "$RUNNER_TEMP/ccvl-archive"
          test ! -e .git
          if command -v git >/dev/null 2>&1; then
            echo "::error::The minimal bootstrap job unexpectedly contains Git."
            exit 1
          fi
          bash ./ccvl setup

  verify:
    name: Mechanical verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"

      - name: Set up Typst
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5.0.1
        with:
          typst-version: 0.15.1

      - name: Set up Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.0.0
        with:
          just-version: 1.58.0

      - name: Install mechanical test tools
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
          TYPSTYLE_SHA256: 213c11bc2c64f7237c382b4bb1d06991530ed9d44d3a05204ca3c19615d55b99
          TYPSTYLE_VERSION: 0.15.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes file poppler-utils qpdf ripgrep shellcheck
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/typstyle-rs/typstyle/releases/download/v${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-gnu" \
            --output "$RUNNER_TEMP/bin/typstyle"
          echo "$TYPSTYLE_SHA256  $RUNNER_TEMP/bin/typstyle" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/bin/typstyle"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check workflows and shell scripts
        run: |
          actionlint -shellcheck shellcheck
          shellcheck scripts/*.sh tests/*.sh

      - name: Run public release checks
        run: just public-check

      - name: Check REUSE licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Record tool versions
        if: always()
        run: |
          {
            echo "## Mechanical toolchain"
            echo
            echo '```text'
            typst --version
            typstyle --version
            just --version
            python3 --version
            actionlint --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
