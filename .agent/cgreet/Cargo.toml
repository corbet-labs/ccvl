[package]
name = "cgreet"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Deterministic locale-correct greeting and salutation helpers"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-labs/ccvl"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
