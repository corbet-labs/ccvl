version = 1

[[annotations]]
path = [
  ".agents/**",
  ".claude/**",
  ".github/**",
  ".vscode/**",
  ".gitattributes",
  ".gitignore",
  "AGENTS.md",
  "ccvl",
  "ccvl.json",
  "justfile",
  "schemas/**",
  "scripts/**",
  "tests/**",
  "cvl/**/*.typ",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "FSL-1.1-ALv2"

[[annotations]]
path = [
  "README.md",
  "CONTRIBUTING.md",
  "CREDITS.md",
  "PUBLIC_IDENTIFIERS.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "docs/**",
  "templates/**",
  "cvl/**/README.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "cvl/**/output/**/*.pdf"
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "CC-BY-ND-4.0"

[[annotations]]
path = [
  "showcase/**/*.json",
  "showcase/**/*.typ",
  "cvl/cl/assets/signature.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "CC-BY-ND-4.0"

[[annotations]]
path = [
  "cvl/shared/fonts/*.ttf",
  "cvl/shared/fonts/NOTICE.md",
  "cvl/shared/fonts/OFL-1.1.txt",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2014-2021 Adobe Systems Incorporated",
  "2017 The EB Garamond Project Authors",
  "2020 IBM Corp.",
  "2020 The Archivo Project Authors",
]
SPDX-License-Identifier = "OFL-1.1"
